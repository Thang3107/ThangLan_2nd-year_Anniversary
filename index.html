<!DOCTYPE html>
<html lang="vi" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <meta name="theme-color" content="#FDE7EE">
  <meta name="robots" content="noindex, nofollow">
  <title>Chapter Two · Thắng &amp; Lan</title>
  <meta name="description" content="Cuốn nhật ký tình yêu của Thắng & Lan mở sang Chương 2 · 20.10.2024 – 20.10.2026">

  <!-- Open Graph: ảnh xem trước khi gửi link qua Messenger/Zalo.
       Đặt 1 ảnh 1200x630 tên og-cover.jpg vào thư mục photos/.
       Khi đã đăng GitHub Pages, nên đổi thành đường dẫn đầy đủ, ví dụ
       https://ten-ban.github.io/ten-repo/photos/og-cover.jpg -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Chapter Two · Thắng & Lan">
  <meta property="og:description" content="Hai năm bên nhau · 20.10.2024 – 20.10.2026. Lật trang Chương 2 nha 💗">
  <meta property="og:image" content="photos/og-cover.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88C20 66 4 50 4 30 4 15 15 5 29 5c9 0 17 5 21 13 4-8 12-13 21-13 14 0 25 10 25 25 0 20-16 36-46 58z' fill='%23E07A9A'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Dancing+Script:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600&display=swap&subset=vietnamese" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-intro">

  <!-- Định nghĩa 5 mảnh tim dùng chung (không hiển thị) -->
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <path id="heartShape" d="M50 88C20 66 4 50 4 28 4 14 15 4 28 4c10 0 18 6 22 14 4-8 12-14 22-14 13 0 24 10 24 24 0 22-16 38-46 60z"/>
      <clipPath id="hp1"><polygon points="0,0 50,0 50,20 42,32 28,40 0,36"/></clipPath>
      <clipPath id="hp2"><polygon points="50,0 100,0 100,36 72,40 58,32 50,20"/></clipPath>
      <clipPath id="hp3"><polygon points="0,36 28,40 42,32 40,54 50,100 0,100"/></clipPath>
      <clipPath id="hp4"><polygon points="42,32 50,20 58,32 60,54 50,100 40,54"/></clipPath>
      <clipPath id="hp5"><polygon points="100,36 72,40 58,32 60,54 50,100 100,100"/></clipPath>
      <linearGradient id="pieceGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F48FAF"/>
        <stop offset="1" stop-color="#C94A76"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Nền hồng của màn mở đầu -->
  <div class="intro-bg" id="introBg" aria-hidden="true"></div>

  <!-- Trái tim bay nền (phía sau nội dung) -->
  <canvas id="heartsBg" class="hearts-bg" aria-hidden="true"></canvas>

  <!-- ============ INTRO: THIỆP 3D ============ -->
  <div class="intro" id="intro">
    <p class="intro__brand" id="introBrand"></p>

    <div class="intro__stage" id="introStage">
      <div class="book" id="book">
        <div class="book__tilt" id="bookTilt">

          <!-- Trang phải (bên trong thiệp) -->
          <div class="book__page book__page--right">
            <div class="page-inner" id="rightPage"></div>
          </div>

          <!-- Bìa thiệp: mặt trước + mặt sau (mặt sau = trang trái khi mở) -->
          <div class="book__cover" id="cover">
            <div class="cover__face cover__front">
              <div class="cover__ribbon" aria-hidden="true"></div>
              <button type="button" class="cover__tap" id="coverTap" aria-label="Chạm để mở thiệp">
                <span class="cover__kicker" id="coverKicker"></span>
                <span class="cover__title" id="coverTitle"></span>
                <span class="cover__sub" id="coverSub"></span>
                <span class="seal" aria-hidden="true"><span class="seal__text" id="sealText"></span></span>
                <span class="cover__hint" id="tapHint"></span>
              </button>

              <form class="lock" id="lockForm" novalidate hidden>
                <p class="lock__q" id="lockQ"></p>
                <label class="sr-only" for="lockInput">Câu trả lời</label>
                <input class="lock__input" id="lockInput" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
                <button type="submit" class="btn btn--rose lock__btn" id="lockBtn"></button>
                <p class="lock__msg" id="lockMsg" role="status" aria-live="polite"></p>
                <p class="lock__hint" id="lockHint" hidden></p>
              </form>
            </div>
            <div class="cover__face cover__back">
              <div class="page-inner page-inner--left" id="leftPage"></div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- ============ NỘI DUNG CHÍNH ============ -->
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

  <main class="main" id="main" inert>
    <section class="hero page" id="hero" aria-labelledby="heroTitle"></section>
    <section class="page" id="together" aria-label="Together"></section>
    <section class="page" id="chapterOne" aria-label="Chapter One"></section>
    <section class="page" id="journey" aria-label="Our Journey"></section>
    <section class="page" id="numbers" aria-label="By The Numbers"></section>
    <section class="page" id="memories" aria-label="Our Memories"></section>
    <section class="page" id="reasons" aria-label="Reasons I Love You"></section>
    <section class="page" id="letters" aria-label="From You & Me"></section>
    <section class="page" id="quiz" aria-label="How Well Do You Know Me?"></section>
    <section class="page" id="dreams" aria-label="Our Dreams"></section>
    <section class="page" id="capsule" aria-label="Time Capsule"></section>
    <footer class="footer page" id="footer"></footer>
  </main>

  <!-- ============ CÁC NÚT CỐ ĐỊNH ============ -->
  <button type="button" class="vinyl" id="vinyl" aria-label="Bật nhạc" aria-pressed="false" hidden>
    <span class="vinyl__disc" aria-hidden="true"><span class="vinyl__label">♥</span></span>
    <span class="vinyl__note" aria-hidden="true">♪</span>
  </button>

  <button type="button" class="badge" id="badge" aria-label="Mảnh tim đã tìm" hidden>
    <svg class="badge__heart" viewBox="0 0 100 92" aria-hidden="true" id="badgeHeart"></svg>
    <span class="badge__count" id="badgeCount">0/5</span>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Lớp chùm tim khi chạm (nổi trên nội dung) -->
  <canvas id="heartsFx" class="hearts-fx" aria-hidden="true"></canvas>

  <!-- ============ LIGHTBOX ẢNH ============ -->
  <div class="modal lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Xem ảnh" hidden>
    <div class="modal__backdrop" data-close></div>
    <figure class="lightbox__figure">
      <div class="lightbox__frame" id="lbFrame"></div>
      <figcaption class="lightbox__caption">
        <span id="lbCaption"></span>
        <span class="lightbox__count" id="lbCount"></span>
      </figcaption>
    </figure>
    <button type="button" class="icon-btn lightbox__prev" id="lbPrev" aria-label="Ảnh trước">‹</button>
    <button type="button" class="icon-btn lightbox__next" id="lbNext" aria-label="Ảnh sau">›</button>
    <button type="button" class="icon-btn modal__close" id="lbClose" aria-label="Đóng">✕</button>
  </div>

  <!-- ============ GHÉP TIM (khi đủ 5 mảnh) ============ -->
  <div class="assemble" id="assemble" aria-hidden="true" hidden>
    <div class="assemble__glow"></div>
    <svg class="assemble__heart" viewBox="0 0 100 92" id="assembleHeart"></svg>
    <p class="assemble__text" id="assembleText"></p>
  </div>

  <!-- ============ MODAL VIDEO ============ -->
  <div class="modal video-modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="videoTitle" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="video-modal__box">
      <header class="video-modal__head">
        <h2 class="video-modal__title" id="videoTitle"></h2>
        <p class="video-modal__sub" id="videoSub"></p>
      </header>
      <div class="video-modal__frame" id="videoFrame"></div>
      <p class="video-modal__note" id="videoNote"></p>
    </div>
    <button type="button" class="icon-btn modal__close" id="videoClose" aria-label="Đóng video">✕</button>
  </div>

  <noscript>
    <p class="noscript">Bật JavaScript lên để mở cuốn nhật ký nha 💗</p>
  </noscript>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
